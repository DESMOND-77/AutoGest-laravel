name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Tous les lundis à 03h00 UTC
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
        # Le support CodeQL pour PHP est en préversion publique et n'est pas
        # activé sur tous les dépôts ; ajouter "php" au tableau ci-dessus dès
        # qu'il est disponible pour ce dépôt.
        # TODO: Complete with project-specific information

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyse automatique
        uses: github/codeql-action/autobuild@v3

      - name: Exécuter l'analyse CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
